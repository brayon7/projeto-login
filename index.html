<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=man" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key" />
    <title>Projeto tela de login</title>
</head>
<body>
   

    <main>

        <img src="img/WhatsApp Image 2025-12-08 at 22.32.28.jpeg" alt="foto do ceu aberto">
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer <br> as configurações no seu ambiente.</p>
        <form action="" method="post" autocomplete="on">
            <p>
                <label for="iemail"><span id="icon1" class="material-symbols-outlined">man</span><label>
                <input type="email" name="email" id="iemail" required placeholder="Seu email:" >
            </p>

            <p>
                <label for="isenha"><span id="icon2" class="material-symbols-outlined">key</span></label>
                <input type="password" name="senha" id="isenha" min="8" placeholder="sua senha:">
            </p>
            <input id="entrar" type="submit" value="Entrar"><br>
            <input id="esqueci" type="reset" value="Esqueci a senha">
        </form>
    </main>
</body>
</html>
